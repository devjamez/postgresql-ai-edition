name: Publish image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (PostgreSQL 16)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PG_VERSION=16
          push: true
          tags: |
            ghcr.io/devjamez/postgresql-ai-edition:latest
            ghcr.io/devjamez/postgresql-ai-edition:${{ github.event.release.tag_name || 'edge' }}

      - name: Build and push (PostgreSQL 17)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PG_VERSION=17
          push: true
          tags: |
            ghcr.io/devjamez/postgresql-ai-edition:pg17
