name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17]
    env:
      PG_VERSION: ${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4

      - name: Build db image (PostgreSQL ${{ matrix.pg }}, compiles pg_ai_core)
        run: docker compose build db

      - name: Start Postgres (without Ollama)
        run: docker compose up -d --no-deps db

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 45); do
            if docker compose exec -T db pg_isready -U postgres -d pgai > /dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"; docker compose logs db; exit 1

      - name: Run smoke tests
        run: docker compose exec -T db psql -U postgres -d pgai -v ON_ERROR_STOP=1 -f - < test/smoke.sql

      - name: Show DB logs on failure
        if: failure()
        run: docker compose logs db
