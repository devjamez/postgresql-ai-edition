services:
  ollama:
    image: ollama/ollama:latest
    container_name: pg_ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  db:
    build:
      context: .
      args:
        PG_VERSION: ${PG_VERSION:-16}
    container_name: pg_ai
    command: ["postgres", "-c", "shared_preload_libraries=pg_ai_core"]
    depends_on:
      - ollama
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgai
      # Local inference via Ollama — no API key required.
      OLLAMA_URL: http://ollama:11434
      AI_EMBED_MODEL: nomic-embed-text
      AI_CHAT_MODEL: llama3.1:8b
      # Optional: only if you want Claude to generate answers (ai.complete_claude).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgai_data:/var/lib/postgresql/data

volumes:
  ollama_data:
  pgai_data:
