apiVersion: v1
kind: Service
metadata:
  name: pgai
  namespace: pg-ai
spec:
  selector:
    app: pgai
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgai
  namespace: pg-ai
spec:
  serviceName: pgai
  replicas: 1
  selector:
    matchLabels:
      app: pgai
  template:
    metadata:
      labels:
        app: pgai
    spec:
      containers:
        - name: pgai
          image: ghcr.io/devjamez/postgresql-ai-edition:latest
          args:
            - "postgres"
            - "-c"
            - "shared_preload_libraries=pg_ai_core"
            - "-c"
            - "pg_ai_core.enable_worker=on"
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: pgai
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgai-secrets
                  key: POSTGRES_PASSWORD
            - name: OLLAMA_URL
              value: "http://ollama:11434"
            - name: AI_EMBED_MODEL
              value: "nomic-embed-text"
            - name: AI_CHAT_MODEL
              value: "llama3.1:8b"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "pgai"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
